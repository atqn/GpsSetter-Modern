name: Setup Keystore (One-time)

# This is a ONE-TIME helper workflow that generates a fresh release keystore
# entirely inside GitHub Actions, then packages the keystore + a random password
# + the SHA-1 fingerprint into a downloadable artifact.
#
# Run it once from the Actions tab (Run workflow button).
# Download the artifact, copy the values into Repository Secrets, then DELETE
# this workflow file so it cannot be run again.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate random password and keystore
        run: |
          # Generate a strong random password (24 chars, alphanumeric)
          KS_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$KS_PASS"

          # Save password to file for the artifact (NOT printed to logs)
          echo "$KS_PASS" > keystore-password.txt

          # Generate keystore with that password
          keytool -genkeypair -v \
            -keystore mylo-release.keystore \
            -alias mylo-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=gne9an1, OU=Personal, O=MyLo, L=Riyadh, ST=Riyadh, C=SA"

          # Extract SHA-1 fingerprint (this IS safe to print)
          SHA1=$(keytool -list -v \
            -keystore mylo-release.keystore \
            -alias mylo-key \
            -storepass "$KS_PASS" \
            | grep "SHA1:" | head -1 | awk '{print $2}')
          echo "SHA1=$SHA1" >> $GITHUB_ENV

          # Encode keystore to base64 (single line, no wrapping)
          base64 -w 0 mylo-release.keystore > keystore-base64.txt

      - name: Create instructions file
        run: |
          cat > INSTRUCTIONS.txt <<'EOF'
          ============================================================
          KEYSTORE GENERATED SUCCESSFULLY — READ THIS CAREFULLY
          ============================================================

          You now have 3 files in this artifact:
            - mylo-release.keystore     (the actual keystore — BACKUP THIS)
            - keystore-password.txt     (the random password we just made)
            - keystore-base64.txt       (the base64 form, for GitHub Secrets)

          ----------------------------------------------------------
          STEP 1 — BACK UP keystore files to a safe place
          ----------------------------------------------------------
          - Save mylo-release.keystore + keystore-password.txt in
            Google Drive (private folder) or any safe location.
          - If you lose these, you can NEVER update this app again.

          ----------------------------------------------------------
          STEP 2 — Add these 4 Secrets to the repo
          ----------------------------------------------------------
          Go to: Settings -> Secrets and variables -> Actions ->
          "New repository secret"

          Create each of these four:

          Secret name:    KEYSTORE_BASE64
          Secret value:   Open keystore-base64.txt and paste its
                          ENTIRE contents (it's one long line).

          Secret name:    KEYSTORE_PASSWORD
          Secret value:   Open keystore-password.txt and paste it.

          Secret name:    KEY_ALIAS
          Secret value:   mylo-key

          Secret name:    KEY_PASSWORD
          Secret value:   Same as KEYSTORE_PASSWORD (paste the same).

          ----------------------------------------------------------
          STEP 3 — Note this SHA-1 fingerprint
          ----------------------------------------------------------
          When you create the new API key in Google Cloud Console,
          you will be asked to "Restrict the key" — paste this SHA-1
          there along with the package name:

          Package name:   com.gne9an1.mylo
          SHA-1:          See SHA1.txt in this artifact.

          ----------------------------------------------------------
          STEP 4 — Tell Claude you finished
          ----------------------------------------------------------
          After you add the 4 Secrets above and create the API key,
          tell Claude and he will update the build.gradle and
          workflow files so future builds use this keystore.

          ============================================================
          EOF

          # Write SHA-1 to its own file so it's easy to copy
          echo "$SHA1" > SHA1.txt
          echo "Package: com.gne9an1.mylo" >> SHA1.txt
          echo "SHA-1:   $SHA1" >> SHA1.txt

          # Print SHA-1 to log so user sees it without downloading
          echo ""
          echo "========================================"
          echo "SHA-1 FINGERPRINT (also in SHA1.txt):"
          echo "$SHA1"
          echo "========================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: |
            mylo-release.keystore
            keystore-password.txt
            keystore-base64.txt
            INSTRUCTIONS.txt
            SHA1.txt
          retention-days: 7
